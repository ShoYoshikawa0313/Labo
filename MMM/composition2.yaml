QED:
  settings:
    max_generations: 1000
    max_oralcle_calls: 10000
    immigration_size: 10
    processes: 3
    immigration_frequency: 1
    immigration_type : no_imm
    patience: 5
  operetors:
    - name: Gemma
      LLM:
        name: gemma2:9b
        type: ollama
        URL: "http://10.34.35.195:11436"
      population_size: 100
      offspring_size: 50
      interval: 0.0
      task: QED
      prompt_template: |
            I have two molecules and their QED scores. The QED score measures the drug-likeness of the molecule.
            <<<ParentInfo>>>
            Please propose a new molecule that has a higher QED score. You can either make crossover and mutations based on the given molecules or just propose a new molecule based on your knowledge.
            
            Output Format: Output one new molecule once in the strict JSON format below.
            Include <<<json start>>> and <<<json end>>> at the beginning and end of the json file.
            Entry must include the SMILES of the new molecule and a logical explanation of the operation.
            
            <<<json start>>>
            {
                "SMILES": "SMILES of the generated molecule",
                "Explanation": "Logical explanation of the operation ... "
            }
            <<<json end>>>
    - name: Qwen3
      LLM:
        name: qwen3:8b
        type: ollama
        URL: "http://10.34.35.195:11437"
      population_size: 100
      offspring_size: 50
