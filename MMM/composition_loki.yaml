        name: qwen3:8b
        type: ollama
        URL: "http://10.34.35.195:11437"
      population_size: 100
      offspring_size: 50
      interval: 0.0
      task: JNK3
      prompt_template: |
            I have two molecules and their JNK3 scores. The JNK3 score measures a moleculars biological activity against JNK3.
            <<<ParentInfo>>>
