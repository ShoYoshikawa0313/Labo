    max_generations: 1000
    max_oralcle_calls: 10000
    immigration_size: 10
    processes: 3
    immigration_frequency: 1
    immigration_type : no_imm
    patience: 5
  operetors:
    - name: BioT5
      LLM:
        name: BioT5
        type: clm
        URL: "http://10.34.35.195:5003"
      population_size: 120
      offspring_size: 70
